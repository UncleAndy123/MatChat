# CI pipeline (PLAN.md §8.5):
#   spotless -> detekt -> konsist -> unit -> paparazzi -> assembleRelease -> size check
# Instrumented traversal tests run nightly (they are slow) — see traversal.yml.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Spotless (format check)
        run: ./gradlew spotlessCheck

      - name: Detekt (static analysis)
        run: ./gradlew detektAll

      - name: Konsist (architecture rules)
        run: ./gradlew :app:testDebugUnitTest --tests "org.matchat.client.arch.*"

      - name: Unit tests
        run: ./gradlew test

      - name: Paparazzi (screenshot diffs)
        run: ./gradlew verifyPaparazziDebug

      - name: Assemble release
        run: ./gradlew :app:assembleRelease

      - name: APK size check (< 25 MB per ABI split)
        run: ./gradlew :app:checkApkSize
