# Single source of dependency versions (PLAN.md §9).
# Adding a dependency requires a one-paragraph justification in the PR
# and an ADR if it is architectural (AGENTS.md §1).
[versions]
# --- Build / language ---
agp = "8.7.3"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"
desugar = "2.1.3"

# --- AndroidX ---
core-ktx = "1.15.0"
appcompat = "1.7.0"
constraintlayout = "2.2.0"
recyclerview = "1.3.2"
fragment = "1.8.5"
navigation = "2.8.5"
lifecycle = "2.8.7"
security-startup = "1.2.0"

# --- DI ---
hilt = "2.53.1"

# --- Async ---
coroutines = "1.9.0"

# --- Images ---
coil = "2.7.0"

# --- Matrix protocol + crypto (added at M1; the ONLY dependency :core:matrix
#     wires to the SDK). Calendar-versioned, matches Element X's binding.
#     Kept here so M1 is a one-line module dependency, not a version hunt. ---
matrix-rustsdk = "25.9.10"

# --- Test ---
junit4 = "4.13.2"
junit-jupiter = "5.11.3"
turbine = "1.2.0"
robolectric = "4.14.1"
androidx-test-ext = "1.2.1"
androidx-test-core = "1.6.1"
uiautomator = "2.3.0"
paparazzi = "1.3.5"
konsist = "0.17.3"

# --- Static analysis ---
detekt = "1.23.7"
spotless = "6.25.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-navigation-fragment = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

coil = { module = "io.coil-kt:coil", version.ref = "coil" }

desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }

# Matrix Rust SDK — wired in :core:matrix at M1.
matrix-rustsdk = { module = "org.matrix.rustcomponents:sdk-android", version.ref = "matrix-rustsdk" }

# --- Test libraries ---
junit4 = { module = "junit:junit", version.ref = "junit4" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit-jupiter" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit-jupiter" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junit-jupiter" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
# org.json is part of the Android runtime; this test-only mirror lets the pure
# PolicyBundleParser be unit-tested on the JVM (Android's unit-test android.jar
# ships org.json as throwing stubs).
json = { module = "org.json:json", version = "20240303" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
navigation-safeargs = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigation" }
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
