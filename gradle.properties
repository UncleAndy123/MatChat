# MatChat — build & app configuration.
# app.name / app.id live here so a later rename stays a one-line change (PLAN.md header).
app.name=MatChat
app.id=org.matchat.client

# --- Gradle ---
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# --- AndroidX ---
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

# --- Kotlin ---
kotlin.code.style=official

# --- E2EE-call shim SDK (docs/VOICE.md §4.1, tools/matrix-shim) ---
# Off by default. When enabled, the build resolves org.matrix.rustcomponents:
# sdk-android to the locally-built patched AAR (mavenLocal) that adds the
# to-device FFI methods. Build the AAR with tools/matrix-shim/build-aar.sh first,
# then set both (here or via -P):
#   matchat.useShimSdk=true
#   matchat.shimSdkVersion=26.09.3-matchat-shim1

# --- Corporate SSL-inspected network (PLAN.md §11) ---
# If Gradle downloads fail with `PKIX path building failed`, import the proxy
# root CA into the JVM truststore and set systemProp.https.proxyHost/Port and
# systemProp.javax.net.ssl.trustStore in ~/.gradle/gradle.properties (per-user,
# not committed). See PLAN.md §11 for the full one-time setup.
